<style>
/* Page servie par GitHub Pages pour toute adresse inconnue : chemins absolus obligatoires. */
@font-face { font-family: 'Fira Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(/assets/fonts/fira-sans-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Fira Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url(/assets/fonts/fira-sans-600-latin.woff2) format('woff2'); }
@font-face { font-family: 'Fira Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url(/assets/fonts/fira-sans-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Zilla Slab'; font-style: normal; font-weight: 700; font-display: swap; src: url(/assets/fonts/zilla-slab-700-latin.woff2) format('woff2'); }
/* Charte « Hautes Terres » : fond latérite, texte blanc chaux. */
:root { --band: #a9432a; --ink: #f4f5ec; --ink-2: #f8e4da; --accent: #e3f0b8; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  background: var(--band); color: var(--ink);
  font: 400 1rem/1.6 "Fira Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 34rem; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: "Zilla Slab", Rockwell, Georgia, serif; font-weight: 700; font-size: 1.1875rem; }
.code { margin: 40px 0 8px; font-size: .8125rem; font-weight: 700; letter-spacing: .32em; color: var(--ink-2); }
h1 { margin: 0; font-family: "Zilla Slab", Rockwell, Georgia, serif; font-weight: 700; font-size: clamp(2.25rem, 7vw, 3.25rem); line-height: 1.08; }
p { color: var(--ink-2); font-size: 1.0625rem; }
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.links a { display: inline-flex; padding: 12px 20px; border-radius: 999px; font-weight: 600; text-decoration: none; font-size: .9375rem; color: var(--ink); border: 1px solid rgba(255,255,255,.28); }
.links a:first-child { background: var(--ink); color: var(--band); border-color: var(--ink); }
.links a:hover { background: rgba(255,255,255,.07); }
.links a:first-child:hover { background: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.foot { margin-top: 36px; font-size: .9375rem; }
.foot a { color: var(--accent); }
</style>
</head>

<main>
