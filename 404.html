<style>
/* Page servie par GitHub Pages pour toute adresse inconnue : chemins absolus obligatoires. */
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/assets/fonts/archivo-latin.woff2) format('woff2'); }
@font-face { font-family: 'Young Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url(/assets/fonts/young-serif-latin.woff2) format('woff2'); }
:root { --band: #14223d; --ink: #f7f9fb; --ink-2: #a5b1c6; --accent: #a1daf4; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  background: var(--band); color: var(--ink);
  font: 400 1rem/1.6 "Archivo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 34rem; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: "Young Serif", Georgia, serif; font-size: 1.1875rem; }
.code { margin: 40px 0 8px; font-size: .8125rem; font-weight: 700; letter-spacing: .32em; color: var(--ink-2); }
h1 { margin: 0; font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: clamp(2.25rem, 7vw, 3.25rem); line-height: 1.08; }
p { color: var(--ink-2); font-size: 1.0625rem; }
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.links a { display: inline-flex; padding: 12px 20px; border-radius: 999px; font-weight: 600; text-decoration: none; font-size: .9375rem; color: var(--ink); border: 1px solid rgba(255,255,255,.28); }
.links a:first-child { background: var(--ink); color: var(--band); border-color: var(--ink); }
.links a:hover { background: rgba(255,255,255,.07); }
.links a:first-child:hover { background: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.foot { margin-top: 36px; font-size: .9375rem; }
.foot a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" aria-label="Le Repère, accueil">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x=".5" y=".5" width="29" height="29" rx="5" fill="#f7f9fb"/><path d="M10 6.5v16h13.5" fill="none" stroke="#14223d" stroke-width="3" stroke-linecap="square"/><circle cx="19" cy="11" r="2.2" fill="#1757a8"/></svg>
    Le Repère

  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incomplet ou ancien. Le livre, les sujets du Bac et la commande sont sur la page d'accueil.</p>

    <a href="/#bac">Sujets du Bac 2021–2026</a>
    <a href="/#commander">Commander le livre</a>
  </div>
  <p class="foot">Commandes : <a href="tel:+261348606886">034 86 068 86</a> (WhatsApp ou appel) · Livraison gratuite à Antananarivo</p>
</main>
</body>
